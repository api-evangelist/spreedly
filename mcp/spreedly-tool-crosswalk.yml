notes: >-
  Binds the two Spreedly MCP surfaces to the Core Transactional OpenAPI. The
  hosted docs MCP (developer.spreedly.com/mcp) is a spec/documentation navigator:
  its 5 tools operate ON the OpenAPI rather than invoking business operations, so
  they are mcp_only (no backing REST operationId). The self-hosted API MCP
  (@spreedly/spreedly-mcp) proxies the real Core operations; its tool categories
  are gated by env flags, so tools are mapped by documented capability to the
  backing operationId(s) — confidence honest, since live inputSchemas require
  authenticated introspection.
