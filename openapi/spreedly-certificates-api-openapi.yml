components:
  schemas:
    generate_certificate:
      type: object
      properties:
        certificate:
          type: object
          properties:
            algorithm:
              type: string
              description: The encryption algorithm to use when creating the key pair. Currently, the only supported options are `ec-prime256v1` representing the X9.62/SECG curve over a 256 bit prime field, or `rsa-2048`, which uses a 2048-bit RSA key.
            cn:
              type: string
              description: The certificate common name
            o:
              type: string
              description: The organization
            ou:
              type: string
              description: The organization unit
            c:
              type: string
              description: The country
            st:
              type: string
              description: The state
            l:
              type: string
              description: The locality or city
            email_address:
              type: string
              description: The email address
          required:
          - algorithm
          - cn
