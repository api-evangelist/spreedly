openapi: 3.2.0
info:
  title: Spreedly API V1 Certificates API
  version: v1
  description: An OpenAPI specification file for V1 of the Spreedly Core Transactional API
servers:
- url: https://core.spreedly.com/v1
tags:
- name: certificates
paths:
  /certificates:
    get:
      summary: List certificates
      tags:
      - certificates
      security:
      - basic_auth: []
      operationId: list-certificates
      description: Retrieve an [ordered and paginated](https://developer.spreedly.com/reference/order-and-pagination) list of all certificates in the authenticated environment.
      parameters:
      - name: order
        in: query
        description: The order of the returned list. Default is `asc`, which returns the oldest records first. To list newer records first, use `desc`.
        schema:
          type: string
      - name: since_token
        in: query
        description: The token of the item to start from (e.g., the last token received in the previous page if iterating through records).
        schema:
          type: string
      responses:
        '200':
          description: Successful
          content:
            application/json:
              examples:
                list_certificates:
                  value:
                    certificates:
