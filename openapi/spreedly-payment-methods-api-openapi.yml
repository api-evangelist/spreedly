    get:
      summary: List payment methods
      tags:
      - payment_methods
      security:
      - basic_auth: []
      operationId: list-payment-method
      description: 'Retrieve an ordered and paginated list of all retained payment methods in the authenticated environment.


        *States*

        Payment methods can exist in several states in the Spreedly vault - retained, redacted, cached, or used. Retained payment methods are stored in Spreedly''s vault until redacted. Redacted payment methods are payment methods that were either not retained or have been manually redacted. Cached payment methods are payment methods that have not been retained but have not yet been automatically redacted yet. Cached payment methods can still be retained. For more information, please see our guide on [retaining payment methods](https://developer.spreedly.com/docs/create-transactions#retain).


        If no state parameter or an invalid state parameter is passed, list will only return retained payment methods. If the state parameter is passed, list will return those parameters: retained, redacted, cached, used.


        Example: `https://core.spreedly.com/v1/payment_methods.json?state=retained,redacted,cached,used`


        If the state parameter is combined with other existing parameters such as metadata, both will be considered.


        Example: `https://core.spreedly.com/v1/payment_methods.json?metadata[customer_id]=123abc&state=redacted,retained`

        '
      parameters:
      - name: order
        in: query
        description: The order of the returned list. Default is `asc`, which returns the oldest records first. To list newer records first, use `desc`.
        schema:
          type: string
      - name: since_token
        in: query
        description: The token of the item to start from (e.g., the last token received in the previous list if iterating through records)
        schema:
          type: string
      - name: metadata
        in: query
        description: A metadata key/value pair represented as a hash (e.g. metadata[key]=value).
        schema:
          type: string
      - name: state
        in: query
        description: The list of storage_states to return. By default returns retained, acceptable values are retained, redacted, cached, used
        schema:
          type: string
      - name: count
        in: query
        description: The number of payment methods to return. By default returns 20, maximum allowed is 100.
        schema:
          type: string
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/payment_methods_response'
            application/xml:
              schema:
                $ref: '#/components/schemas/payment_methods_response'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
            application/xml:
              schema:
                $ref: '#/components/schemas/errors'
