                        payment_method_type: credit_card
                        errors: []
                        fingerprint: null
                        verification_value: XXX
                        number: XXXX-XXXX-XXXX-1111
            application/json:
              schema:
                $ref: '#/components/schemas/payment_method_events_response'
            application/xml:
              schema:
                $ref: '#/components/schemas/payment_method_events_response'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
            application/xml:
              schema:
                $ref: '#/components/schemas/errors'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
            application/xml:
              schema:
                $ref: '#/components/schemas/errors'
  /gateways/{gateway_token}/store:
    post:
      summary: Create a store transaction
      tags:
      - payment_methods
      security:
      - basic_auth: []
      operationId: payment_method.store
      description: 'Tokenize a payment method *at the gateway*.


        This transaction copies the payment method information from the Spreedly vault [to the gateway''s vault](https://developer.spreedly.com/docs/third-party-vaulting) and creates a new Spreedly payment method to represent the gateway''s version. The reference to the payment method at the gateway is called a ThirdPartyToken and is a separate payment method from the original payment method. It is up to you to manage the lifecycle of these linked payment methods – Spreedly does not keep them in sync in any way.


        The ThirdPartyToken is locked to the gateway where the card is stored; it cannot be used at another gateway. If you''d like a card to be used at multiple gateways, you''ll need to [retain the card in the Spreedly vault](https://developer.spreedly.com/docs/create-transactions#retain).

        '
      parameters:
      - $ref: '#/components/parameters/gateway_token'
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/store_response'
            application/xml:
              schema:
                $ref: '#/components/schemas/store_response'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
            application/xml:
              schema:
                $ref: '#/components/schemas/errors'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
            application/xml:
              schema:
                $ref: '#/components/schemas/errors'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/store'
            examples:
              Store at gateway:
                summary: Store at gateway
                value: '{"transaction":{"payment_method_token":""}}'
          application/xml:
            schema:
              $ref: '#/components/schemas/store'
            examples:
              Store at gateway:
                summary: Store at gateway
                value: '{"transaction":{"payment_method_token":""}}'
components:
