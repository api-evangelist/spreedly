name: Spreedly
kind: company
description: >-
  Spreedly is a United States payments orchestration platform and PCI-compliant
  card vault that lets merchants and platforms securely tokenize payment methods
  once and then transact against hundreds of payment gateways, processors, and
  third-party APIs through a single integration. Founded in 2008 and
  headquartered in Durham, North Carolina, Spreedly sits in the gateway/PSP layer
  of the deep, fragmented US payments market as an independent, network-agnostic
  intermediary rather than a card network or acquirer. Its Payments Orchestration
  offering combines a universal token vault, a normalized transaction API across
  many gateways, workflow-based routing (Composer), network tokenization, account
  updater (Card Refresher), 3-D Secure / SCA authentication, and Receivers for
  forwarding stored payment data to arbitrary third-party endpoints. Spreedly is
  strongly API-native: it publishes a public developer portal with complete
  reference documentation and a downloadable OpenAPI 3.1 specification for its
  Core Transactional API (https://core.spreedly.com/v1), authenticated with HTTP
  Basic auth using per-environment key/secret credentials.
