apis:
- aid: spreedly:spreedly-core-api
  name: Spreedly Core Transactional API
  description: >-
    The Spreedly Core Transactional API — the primary REST surface for the
    Payments Orchestration platform. Covers payment method tokenization/vaulting,
    gateway creation and management, and the full transaction lifecycle
    (authorize, capture, purchase, verify, void, credit/refund) across many
    downstream gateways from a single normalized integration. Documented as
    OpenAPI 3.1 with 68 paths; base URL https://core.spreedly.com/v1;
    HTTP Basic authentication using an environment key and secret.
  humanURL: https://developer.spreedly.com/reference/api-introduction
  baseURL: https://core.spreedly.com/v1
  tags:
  - Payments
  - Transaction
  - Vault
  tags_raw:
  - Payments
  - Transactions
  - Vault
  properties:
  - type: OpenAPI
    url: openapi/spreedly-api-v1.json
  - type: Documentation
    url: https://developer.spreedly.com/docs/overview
  - type: APIReference
    url: https://developer.spreedly.com/reference/api-introduction
- aid: spreedly:spreedly-payment-methods-api
  name: Spreedly Payment Methods & Vault API
  description: >-
    Create, retain, redact, recache, update, and inspect tokenized payment
    methods held in Spreedly's PCI-compliant universal vault, including
    field-level encryption and payment method event history. Part of the Core
    Transactional API surface.
  humanURL: https://developer.spreedly.com/reference/create-payment-method
  baseURL: https://core.spreedly.com/v1
  tags:
  - Vault
  - Tokenization
  - Payment Methods
  properties:
  - type: OpenAPI
    url: openapi/spreedly-api-v1.json
  - type: APIReference
    url: https://developer.spreedly.com/reference/list-payment-method
  - type: Documentation
    url: https://developer.spreedly.com/docs/advanced-vault
- aid: spreedly:spreedly-composer-api
  name: Spreedly Composer (Workflows) API
  description: >-
    Workflow-driven orchestration endpoints (Composer) that execute an
    authorization, purchase, or verification against a configured routing
    workflow rather than a single named gateway, enabling failover, cascading,
    and rules-based routing across Spreedly's connected gateways.
  humanURL: https://developer.spreedly.com/reference/composerpurchase
  baseURL: https://core.spreedly.com/v1
  tags:
  - Payment Orchestration
  - Workflows
  - Routing
  properties:
  - type: OpenAPI
    url: openapi/spreedly-api-v1.json
  - type: APIReference
    url: https://developer.spreedly.com/reference/composerauthorize
- aid: spreedly:spreedly-network-tokenization-api
  name: Spreedly Network Tokenization API
  description: >-
    Retrieve card metadata and lifecycle status for network tokens (Visa, Mastercard,
    Amex network-provisioned tokens) managed through Spreedly, supporting
    network tokenization for improved authorization rates and credential-on-file
    security.
  humanURL: https://developer.spreedly.com/reference/network-tokenization-status
  baseURL: https://core.spreedly.com/v1
  tags:
  - Network Tokenization
  - Card Metadata
  properties:
  - type: OpenAPI
    url: openapi/spreedly-api-v1.json
  - type: APIReference
    url: https://developer.spreedly.com/reference/network-tokenization-card-metadata
- aid: spreedly:spreedly-account-updater-api
  name: Spreedly Account Updater (Card Refresher) API
  description: >-
    Card Refresher / account updater inquiries that refresh stored card
    credentials (expiration dates and PANs) against the card networks' account
    updater services to reduce declines on stored payment methods.
  humanURL: https://developer.spreedly.com/reference/card_refresher_inquiry
  baseURL: https://core.spreedly.com/v1
  tags:
  - Account Updater
  - Card Refresher
  properties:
  - type: OpenAPI
    url: openapi/spreedly-api-v1.json
  - type: APIReference
    url: https://developer.spreedly.com/reference/list-inquiries
- aid: spreedly:spreedly-receivers-api
  name: Spreedly Receivers API
  description: >-
    Receivers let merchants forward securely vaulted payment data from the
    Spreedly vault to arbitrary third-party HTTP endpoints, extending
    tokenization beyond payment gateways to any API that needs card data.
  humanURL: https://developer.spreedly.com/reference/list-supported-receivers
  baseURL: https://core.spreedly.com/v1
  tags:
  - Receivers
  - Data Forwarding
  properties:
  - type: OpenAPI
    url: openapi/spreedly-api-v1.json
  - type: APIReference
    url: https://developer.spreedly.com/reference/create-receiver
- aid: spreedly:spreedly-sca-api
  name: Spreedly 3-D Secure / SCA Authentication API
  description: >-
    Strong Customer Authentication endpoints to authenticate a given payment
    method and manage SCA providers on a merchant profile, supporting 3-D Secure
    2.x authentication flows for cardholder verification.
  humanURL: https://developer.spreedly.com/reference/authenticate
  baseURL: https://core.spreedly.com/v1
  tags:
  - 3DS
  - SCA
  - Authentication
  properties:
  - type: OpenAPI
    url: openapi/spreedly-api-v1.json
  - type: APIReference
    url: https://developer.spreedly.com/reference/create-sca-provider
