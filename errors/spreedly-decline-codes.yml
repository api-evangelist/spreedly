generated: '2026-07-24'
method: searched
source: https://developer.spreedly.com/docs/normalized-values
notes: >-
  Spreedly normalizes gateway/processor decline responses across all supported
  gateways into two Spreedly-managed fields returned on the transaction response:
  gateway_response.payment_outcome_data.failure_reason (WHY it failed) and
  gateway_response.payment_outcome_data.network_advice_code (what to DO next).
  The raw gateway values are preserved under raw_payment_outcome_data. These are
  the cross-gateway decline taxonomy; a given gateway maps its own codes into
  these normalized values. failure_reason has an error_type of hard or soft.
envelope:
  failure_reason: gateway_response.payment_outcome_data.failure_reason
  network_advice_code: gateway_response.payment_outcome_data.network_advice_code
  raw: gateway_response.raw_payment_outcome_data (processor_decline_code + raw merchant advice code)
failure_reasons:
  - code: do_not_honor
  - code: insufficient_funds
  - code: expired_card
  - code: incorrect_cvv
  - code: incorrect_zip
  - code: incorrect_address
