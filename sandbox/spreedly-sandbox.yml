method: searched
source: https://developer.spreedly.com/docs/test-data + https://developer.spreedly.com/docs/testing
notes: >-
  Spreedly has no distinct "test environment" type — all environments can run
  billable transactions. Testing is done by provisioning a Test gateway (requires
  no credentials) and using the published test payment methods. Test data is only
  recognized by the Test gateway; any card not in the test set is treated as a
  real card. Spreedly also offers a test-only payment method type called "Sprel"
  for building Offsite Payments workflows. Test API calls are metered and billed.
test_gateway:
  create: POST /gateways.json with gateway_type "test"
  credentials_required: false
  behavior: mirrors a production gateway (direct + offsite, 3DS, bank accounts) but only accepts test payment methods
